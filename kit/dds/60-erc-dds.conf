# /etc/sysctl.d/60-erc-dds.conf on the team laptop (erc-gym lane C, 2026-11-05).
# Lets CycloneDDS hold 4 MB UDP receive buffers. At the default 212992 a lone best-effort reader of a 3.7 MB frame got
# 0 Hz (HPC cpuq). At 4194304 it got 11.7 of 15 Hz (Z8 container).
# Apply now: sudo sysctl -w net.core.rmem_max=4194304     Persist: sudo cp 60-erc-dds.conf /etc/sysctl.d/ && sudo sysctl --system
net.core.rmem_max=4194304
